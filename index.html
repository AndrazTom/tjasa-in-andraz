<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tjaša & Andraž</title>
<!-- preloaded so the whole intro sequence (flap open, popcard, sketch reveal) has everything
     already in cache instead of fetching mid-animation — biggest win on a first (uncached) load.
     fetchpriority=high on the three images visible before any interaction; the rest (needed
     within seconds of the click) preload too, just without competing for top priority. -->
<link rel="preload" as="image" href="images/vila-watercolour.jpg" fetchpriority="high">
<link rel="preload" as="image" href="images/envelope-closed.png" fetchpriority="high">
<link rel="preload" as="image" href="images/seal.png" fetchpriority="high">
<link rel="preload" as="image" href="images/envelope-open.png">
<link rel="preload" as="image" href="images/vila-sketch.jpg">
<link rel="preload" as="image" href="images/bracket-top.png">
<link rel="preload" as="image" href="images/bracket-bottom.png">
<link rel="preload" as="image" href="images/landscape-color.jpg">
<link rel="preload" as="image" href="images/bottom-bracket.png">
<link rel="preload" as="image" href="images/swan.jpg">
<link rel="preload" as="image" href="images/plates.jpg">
<link rel="preload" as="image" href="images/TA.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@400;500;600&family=Cormorant+SC:wght@500&family=Pinyon+Script&display=swap');

  :root{
    --paper:#f3efe8; /* sampled from the current landscape-color.jpg's top edge pixels (swapped in
                         2026-09-15 — a picked-for-now color, not yet chosen for overall
                         cohesion with the new photo) */
    --motif-cream:#eee9dd; /* scraped (averaged, ~60px patch) from the middle of the plate in
                               images/plates.jpg — used for the countdown squares so they read
                               as the same cream tone as the swan/plate motifs above them */
    --ink:#647353;
    --ink-soft:rgba(99,115,83,0.88);
    --ink-faint:rgba(99,115,83,0.75);
    --line-strong:rgba(99,115,83,0.5);
    --envelope-cream:#ede7d8; /* scraped (averaged) from images/envelope-open.png's flat paper
                                  areas — used for the intro popcard "leaflet", not the page's
                                  own --paper, since it should read as the same cream stock as
                                  the envelope it pops out of, not the (unrelated) landscape tone */
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    padding:0;
    overscroll-behavior-y:none; /* locks top/bottom: no elastic rubber-band bounce past the
      page's own start/end. Without this, scrolling past either end (then snapping back) has to
      repaint the large background-image bands underneath, which is what read as janky/laggy —
      this removes that motion entirely rather than trying to make it cheaper. */
  }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Cormorant Garamond', serif;
  }

  .page{
    width:100%;
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
  }

  .section{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:0 28px;
  }

  .headline{
    margin-top:-20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:fadeIn 1.3s ease both 11.0s; /* 2: headline */
  }
  .save-line{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:10px;
  }
  .save{
    font-family:'Pinyon Script', cursive;
    font-size:58px;
    line-height:0.75;
    color:var(--ink);
  }
  .the{
    font-family:'Cormorant SC', serif;
    font-size:17px;
    letter-spacing:4px;
    color:var(--ink);
  }
  .date-word{
    font-family:'Pinyon Script', cursive;
    font-size:63px;
    line-height:0.75;
    color:var(--ink);
    margin-top:0px; /* pulls "Date" up so it nearly touches "Save the" above it — smaller now
                        that the text itself is smaller, needs less overlap to still nearly touch */
  }

  .wedding-date{
    font-family:'Cormorant SC', serif;
    font-size:28px;
    letter-spacing:3px; /* was 6px — tighter spacing between the digits */
    color:var(--ink);
    margin-top:-5px; /* pulls it up closer to "Date" now that the divider line is gone */
    animation:fadeIn 1.2s ease both 11.7s; /* 4: date */
  }

  /* decorative floral frame (source: images/curvyBracket.png, split top/bottom
     by tools/prep_bracket.py) opened around the headline/date/venue block.
     aspect-ratio reserves layout space before the image loads — without it
     the villa alignment script (which measures .villa-hero's position on
     load) runs before these load and picks up a stale, too-high position. */
  .bracket{
    display:block;
    width:110%;
    max-width:420px;
    height:auto;
  }
  .bracket-top{
    aspect-ratio:1100/373;
    margin:2px 0 -38px; /* top margin replaces the removed sprig's breathing room */
    animation:fadeIn 1.3s ease both 11.0s; /* 2: headline (bracket pairs with it) */
  }
  .bracket-bottom{
    aspect-ratio:1100/360;
    margin:-58px 0 0;
    position:relative; /* .villa-hero (position:relative too) is a later sibling, so without this
                           it paints on top of the overlap regardless of DOM order — positioned
                           elements always beat non-positioned ones, DOM order doesn't matter */
    z-index:1;
    animation:fadeIn 1.2s ease both 11.0s; /* 2: headline (bracket pairs with it; venue removed, was stage 5) */
  }

  .top{
    margin-bottom:-27px; /* negative — ok to let bracket-bottom overlap into .villa-hero's own
                             top edge, since the sketch image has a lot of empty/paper margin
                             above the actual villa content there */
    /* margin-top is set live by the villa-alignment script (see below), overwriting whatever's
       here — a static guessed value can't work since it needs to counteract Mobile Safari's
       actual viewport height, which varies by device and even by scroll state (address bar
       hide/show). Editing it here has no visible effect; margin-bottom above is the real,
       static lever for the gap below this block. */
  }

  /* sized to the photo's own aspect ratio so it shows uncropped */
  .villa-hero{
    width:80%;
    margin:0 auto;
    aspect-ratio:1292/866;
    background-color:var(--paper);
    background-image:url('images/vila-sketch.jpg');
    background-size:100%;
    background-repeat:no-repeat;
    background-position:center;
    position:relative;
  }
  .villa-hero::before, .villa-hero::after{
    content:"";
    position:absolute;
    left:0; right:0;
    height:56px;
    pointer-events:none;
  }
  .villa-hero::before{ top:0; background:linear-gradient(180deg, var(--paper), transparent); }
  .villa-hero::after{ bottom:0; background:linear-gradient(0deg, var(--paper), transparent); }

  .bottom{
    padding-top:0;
    padding-bottom:36px;
  }

  /* full-bleed sketched landscape behind everything from here down — edge to edge of .page
     (no .section padding), matching the villa sketch's duotone style. The countdown/locations/
     contact/footer below aren't redesigned yet, just re-housed inside the new bracket-frame. */
  .landscape-band{
    width:100%;
    position:relative; /* anchors the top/bottom paper-fade pseudo-elements below */
    margin-top:-40px; /* pulls the band up closer to the villa sketch above — it, and the
                          .bracket-frame inside it, move up together since the frame is just a
                          normal child; nothing separate needed to keep them in sync */
    background-image:url('images/landscape-color.jpg');
    background-size:cover;
    background-position:center;
    padding:40px 20px;
    animation:fadeIn 1.3s ease both 13.0s; /* 12: landscape band — starts 0.1s after the date
      above (11: 11.7s+1.2s=12.9s) finishes, fully in by 14.3s. Scroll is locked for all of this
      (see openEnvelope()'s LANDSCAPE_DONE_AT), so the band showing half cut-off at the bottom
      of the screen is what tells a guest there's more below to scroll to. */
  }
  /* soften the hard edge where the villa sketch's paper background meets the photo — same
     paper-to-transparent idea as .villa-hero's own fades, but much taller (longer fade distance)
     and eased (color-mix stops instead of a flat 2-stop linear-gradient) so it reads as a slow,
     gradual reveal rather than a quick linear wash — a plain 2-stop gradient looks like it's
     already half-cleared by its midpoint, which read as too fast. Fine for this to eat well into
     the photo itself — .bracket-frame sits above it (see its z-index) so the fade is free to run
     under the frame's own baked-in cream fill without showing through it regardless of height. */
  .landscape-band::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:380px;
    pointer-events:none;
    background:linear-gradient(180deg,
      var(--paper) 0%,
      color-mix(in srgb, var(--paper) 92%, transparent) 15%,
      color-mix(in srgb, var(--paper) 75%, transparent) 32%,
      color-mix(in srgb, var(--paper) 55%, transparent) 50%,
      color-mix(in srgb, var(--paper) 34%, transparent) 68%,
      color-mix(in srgb, var(--paper) 15%, transparent) 85%,
      transparent 100%);
  }
  .bracket-frame{
    position:relative;
    z-index:1; /* paint above the landscape-band's paper-fade pseudo-elements, which would
                  otherwise wash out the frame's bottom edge where the two overlap */
    width:100%;
    max-width:360px;
    margin:90px auto 0; /* was 50px — pushed another 40px lower in the landscape-band */
    /* No aspect-ratio here (was 941/1672, bottom-bracket.png's own ratio) — this box's actual
       content (T&A monogram + countdown + locations + footer) is already taller than that ratio
       implies at every width we've measured, so the box's real height is always content-driven
       regardless. Content height is close to fixed in px (countdown squares, gaps, padding are
       all fixed sizes) while an aspect-ratio-derived height only scales with the frame's own
       width — the two barely differ between an iPhone Pro and Pro Max (~7px frame-width
       difference), which is consistent with the bug this fixes: text sitting right at/just past
       the bottom of the artwork on the narrower phone but not the wider one, i.e. a cross-browser
       difference in whether the box grows for overflowing content when aspect-ratio is set.
       Dropping aspect-ratio removes that ambiguity — height is always exactly content's height in
       every browser, and background-size:100% 100% always stretches to match it exactly, so the
       artwork's bottom edge is always the box's bottom edge and content can't clip past it. */
    background-image:url('images/bottom-bracket.png');
    background-size:100% 100%;
    background-repeat:no-repeat;
    padding:52px 45px 60px; /* was 100px, then 60px — shrunk another 8px so the T&A monogram
                                sits 8px higher still, right in the scalloped top notch's clearance */
    opacity:0; /* invisible until scrolled into view — see .in-view + the IntersectionObserver
                  armed in openEnvelope() once scroll unlocks */
    will-change:opacity; /* keeps the fade a compositor-only operation instead of repainting
                             this large background image every frame — avoids scroll jank */
  }
  /* T&A monogram, sitting in the scalloped top notch's own clearance (the 52px padding-top
     above) — being a normal flow child here, it naturally pushes the countdown/locations/
     footer below it down by its own height + margin, no separate spacing hack needed. Margin
     bumped to 27px (was 10px, then 32px) each time the padding-top above shrank: the monogram
     moves higher than the countdown below it, so the gap between them keeps growing to make up
     the difference. */
  .ta-monogram{
    display:block;
    width:60px;
    height:auto;
    margin:0 0 27px;
  }
  .bracket-frame.in-view{
    animation:fadeIn 2s ease both; /* slower than the landscape band's own fade above */
  }

  /* Countdown */
  .countdown{
    display:flex;
    gap:6px; /* was 9px (originally 14px) — narrower gap between the day/hour/min/sec blocks */
    margin-top:-1px; /* was 14px — moved 15px higher, closer to the T&A monogram above */
  }
  .cd-unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:52px;
  }
  .cd-num{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:26px;
    color:var(--ink);
    background:var(--motif-cream);
    border-radius:8px;
    width:52px;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-variant-numeric:tabular-nums;
  }
  .cd-label{
    margin-top:6px;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ink-faint);
  }

  /* Locations */
  .locations{
    margin-top:14px; /* was 30px — tighter gap under the countdown now the swan motif sits there */
    width:100%;
    display:flex;
    flex-direction:column;
    gap:18px; /* was 10px — a bit more room now each card has its own motif above it */
  }
  .loc-group{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px; /* was 4px — the motif images are already cropped tight to their own artwork,
                 so this just needs to be a hairline, not real breathing room */
  }
  /* decorative motif above each card — swan (Vipolže) / plate+cutlery (Rouna). Both are
     flattened onto the bottom-bracket's own cream fill (#fdf9ef, see images/swan.jpg and
     images/plates.jpg), so they read as printed straight onto the card stock with no visible
     edge against .bracket-frame's background. */
  .loc-motif{
    display:block;
    width:100px;
    height:auto;
  }
  .loc-motif-swan{
    margin-top:15px;
  }
  .loc-motif-plate{
    width:82px; /* a bit smaller than the swan — the plate/cutlery drawing reads visually
                    heavier at the same width */
  }
  /* no visible card chrome (background/border) any more — just the pin + venue text, sitting
     directly on the bracket-frame's own cream fill. The whole link area stays exactly as big
     as before (same padding) so it's still an easy tap target, it just doesn't look like a
     button until tapped, when :active gives a brief, subtle highlight as feedback. */
  .loc-card{
    display:block;
    width:100%;
    padding:12px 16px;
    text-decoration:none;
    color:var(--ink);
    border-radius:12px;
    transition:background 0.2s ease;
  }
  .loc-card:active{ background:rgba(99,115,83,0.12); }
  /* .loc-text centers each row (name+icon row, and the address row below) independently on the
     card's own full width, i.e. the bracket's middle — not as one shared block, so each row's
     width can differ (the "pyramid" look) without either row dragging the other off-center. */
  .loc-text{
    width:fit-content;
    margin:0 auto;
    text-align:center;
  }
  /* pin sits inline with the venue name specifically, the two centered together as one row,
     rather than spanning/centered against the full two-line text block. */
  .loc-name-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .loc-icon{
    flex:none;
    width:20px;
    height:20px;
    color:var(--ink);
  }
  .loc-name{
    font-size:17px;
    line-height:1.25;
  }
  .loc-sub{
    font-size:13px;
    font-style:italic;
    color:var(--ink-soft);
  }

  .footer{
    margin-top:39px; /* was 36px — nudged 3px lower */
  }
  .footer-note{
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ink-faint);
    line-height:1.8;
  }

  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  @keyframes fadeDown{ from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:none;} }
  @keyframes popIn{ from{transform:scale(0);} to{transform:scale(1);} }

  @media (max-width:380px){
    .headline{ margin-top:-13px; }
    .save-line{ gap:6px; }
    .save{ font-size:42px; }
    .date-word{ font-size:46px; margin-top:-4px; }
    .the{ font-size:15px; letter-spacing:2px; }
  }

  /* Envelope intro */
  body.locked{ overflow:hidden; height:100dvh; }

  .envelope-cover{
    position:fixed;
    inset:0;
    z-index:999;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    background:var(--paper);
    transition:opacity 3.4s ease 4.1s; /* cover to page, 0.2s after envelope+sender+popcard are fully gone (3.9s) */
  }
  .envelope-cover.opened{
    opacity:0;
    pointer-events:none;
  }

  .reveal-photo, .reveal-overlay{
    position:absolute;
    inset:0;
    z-index:0;
  }
  .reveal-photo{
    background-image:url('images/vila-watercolour.jpg');
    background-size:cover;
    background-position:50% 47%; /* no-JS fallback; script overrides both, see below */
    transform:scale(1.08);
    transition:transform 1.8s cubic-bezier(.2,.7,.3,1); /* photo zoom-settle */
  }
  .envelope-cover.opened .reveal-photo{
    transform:scale(1);
  }
  .reveal-overlay{
    z-index:1;
    background:
      linear-gradient(to bottom, rgba(18,20,10,0.58) 0%, rgba(18,20,10,0) 34%, rgba(18,20,10,0) 66%, rgba(18,20,10,0.55) 100%),
      radial-gradient(circle at 50% 42%, rgba(248,243,231,0.08), rgba(248,243,231,0.3) 100%);
  }

  .envelope-sender{
    position:relative;
    z-index:3;
    text-align:center;
    color:#fff;
    transition:opacity 0.6s ease 3.3s; /* sender fades, after popcard has had its moment */
  }
  .envelope-cover.opened .envelope-sender{
    opacity:0;
  }
  .envelope-sender .sender-names{
    display:block;
    margin-top:16px;
    font-family:'Pinyon Script', cursive;
    font-size:62px;
    line-height:0.85;
    text-shadow:0 1px 3px rgba(0,0,0,0.65), 0 2px 14px rgba(0,0,0,0.55);
    opacity:0;
    animation:fadeIn 0.8s ease both 0.9s; /* intro: 2 names, after the note settles */
  }
  .envelope-sender .sender-amp{
    font-family:'Alex Brush', cursive; /* Pinyon Script's own & glyph looked off */
    font-size:1.15em;
  }
  .envelope-sender .sender-note{
    display:block;
    font-family:'Cormorant SC', serif;
    font-size:25px;
    letter-spacing:3px;
    text-transform:uppercase;
    opacity:0;
    animation:fadeIn 0.8s ease both 0.3s; /* intro: 1 note */
    text-shadow:0 1px 2px rgba(0,0,0,0.6), 0 1px 10px rgba(0,0,0,0.5);
  }

  .envelope-btn{
    all:unset;
    display:block;
    cursor:pointer;
    position:relative;
    z-index:3;
    width:min(280px, 68vw);
    aspect-ratio:175/212; /* matches the envelope-open/closed.png canvas (700x848) */
    margin-top:-20px; /* nudge up within the centered flex column */
    transition:opacity 0.6s ease 3.3s; /* envelope fades, after popcard has had its moment */
    -webkit-tap-highlight-color:transparent; /* kills WebKit's default tap-flash */
    animation:popIn 0.6s cubic-bezier(.34,1.56,.64,1) both 1.5s; /* intro: 3 envelope+seal pop; transform only, never opacity — that fought the close-fade transition below */
    pointer-events:none; /* stays inert until .envelope-cover gets .ready (JS, once the note/
                             names/pop/hint entrance animations have all finished at ~2.8s) —
                             a click mid-entrance shouldn't be able to kick off the open sequence */
  }
  .envelope-cover.ready .envelope-btn{
    pointer-events:auto;
  }
  .envelope-cover.opened .envelope-btn{
    opacity:0;
  }

  /* closed/open crossfade in place of a flap animation; both PNGs pre-aligned (see tools/) */
  .envelope-photo{
    position:absolute;
    inset:-14.1509% -17.1429%; /* box padded beyond the photo so the drop-shadow has room to bleed, else it clips into a hard rectangle */
    background-size:74.468% 77.941%; /* shrinks photo back down to fit the un-padded center of the box */
    background-position:center;
    background-repeat:no-repeat;
    transition:opacity 1.4s ease; /* flap opens (crossfade), slowed */
    filter:drop-shadow(0 4px 10px rgba(15,17,8,0.75)) drop-shadow(0 22px 30px rgba(30,40,25,0.4));
  }
  .envelope-photo-closed{
    background-image:url('images/envelope-closed.png');
    z-index:2;
  }
  .envelope-photo-open{
    background-image:url('images/envelope-open.png');
    z-index:1;
    opacity:0;
  }
  .envelope-cover.opened .envelope-photo-closed{
    opacity:0;
  }
  .envelope-cover.opened .envelope-photo-open{
    opacity:1;
  }

  /* same box-padding trick as .envelope-photo — box (100px) sized bigger than the seal's 50px display size for shadow room */
  .envelope-seal{
    position:absolute;
    top:75%; left:50%; /* flap's fold tip */
    transform:translate(-50%,-50%);
    width:100px; height:100px;
    z-index:3;
    background-image:url('images/seal.png');
    background-size:50%; /* shrinks back down to the tuned 50px (50/100) */
    background-repeat:no-repeat;
    background-position:center;
    transition:opacity 0.6s ease, transform 0.6s ease; /* seal fades */
    filter:drop-shadow(0 4px 7px rgba(60,45,15,0.3));
  }
  .envelope-cover.opened .envelope-seal{
    opacity:0;
    transform:translate(-50%,-50%) scale(0.5);
  }

  /* small "Save the Date" card that pops out of the open envelope and
     stays up alongside the envelope + sender text for a beat (both now
     linger until ~3.9s instead of fading right after the flap opens — see
     the envelope-sender/envelope-btn/envelope-hint transition-delays)
     before everything fades together and the cover dissolves into the
     real (full-size) page version. Self-contained fade in/out via one
     animation, tuned to finish at the same ~3.9s as the envelope/sender —
     by the time the cover's own fade starts (4.1s, see .envelope-cover),
     this has already faded out on its own. */
  .popcard{
    position:absolute;
    top:44%;
    left:50%;
    z-index:4; /* stays in front throughout, so the alpha fade is actually visible as it happens —
                  a behind/in-front z-index flip mid-fade was tried and looked broken: opacity had
                  already ramped up to ~93% *while hidden behind the envelope*, so it read as an
                  instant pop the moment it flipped in front, not a fade */
    width:min(210px, 52vw); /* noticeably smaller than the envelope's own min(280px,68vw) box —
                                a leaflet pulled out shouldn't be bigger than the envelope itself.
                                Proportions (not just size) scaled down from the wider version so
                                the landscape ratio is preserved — the envelope's own canvas is a
                                padded portrait 700x848 file, but the actual *visible* envelope
                                drawing inside it is landscape (612x471, measured off its alpha
                                channel) — match that shape, not the padded file dimensions */
    padding:6px 8px 5px;
    background:var(--envelope-cream);
    border-radius:3px;
    box-shadow:0 10px 26px rgba(15,17,8,0.45);
    pointer-events:none;
    opacity:0;
    transform:translate(-50%,-14%); /* parked low, near the envelope, until opened */
  }
  /* animation lives on the .opened-scoped selector (not the bare .popcard
     above) so its delay counts from the click, not from page load — an
     unconditional `animation` on .popcard would start its clock at page
     load, so if someone takes longer than the delay to click, the card
     pops and vanishes while the envelope is still closed. */
  .envelope-cover.opened .popcard{
    animation:popCard 2.4s ease-out both 1.4s; /* intro: card pulls out of the envelope, after flap opens */
  }
  .popcard-bracket{
    display:block;
    width:100%;
    height:auto;
  }
  .popcard-bracket-top{
    aspect-ratio:1100/373;
    margin-bottom:-10px;
  }
  .popcard-bracket-bottom{
    aspect-ratio:1100/360;
    margin-top:-16px;
  }
  .popcard-headline{
    display:flex;

  }

    font-family:'Pinyon Script', cursive;

  }
  @keyframes popCard{
    0%   { opacity:0; transform:translate(-50%,-8%); } /* low, parked at the envelope */
    31%  { opacity:1; transform:translate(-50%,-22%); } /* slides up while visibly fading in — stops short of the sender text above; same absolute rise time as before (~0.7s), just a smaller % of the now-longer duration */
    81%  { opacity:1; transform:translate(-50%,-22%); } /* holds ~0.3s longer than before, so it disappears alongside the envelope/sender group instead of slightly ahead of them */
    100% { opacity:0; transform:translate(-50%,-22%); } /* fades out in place, no more motion */
  }

  /* entrance animation on the inner span, not here — an opacity animation
     and the close-fade transition on the same element fought each other */
  .envelope-hint{
    position:relative;
    z-index:3;
    font-family:'Cormorant SC', serif;
    font-size:25px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,0.6), 0 1px 10px rgba(0,0,0,0.5);
    transition:opacity 0.6s ease 3.3s; /* hint fades, after popcard has had its moment */
  }
  .envelope-hint .hint-text{
    display:inline-block;
    opacity:0;
    animation:fadeIn 0.6s ease both 2.2s; /* intro: 4 hint */
  }
  .envelope-cover.opened .envelope-hint{
    opacity:0;
  }
</style>

<body class="locked">

<script>
  // Backstop for the viewport meta's user-scalable=no/maximum-scale=1 above — modern iOS Safari
  // silently ignores both (deliberately, for accessibility), so pinch- and double-tap-zoom can
  // still happen without this. Blocks both gestures directly instead of relying on the meta tag.
  (function(){
    document.addEventListener('touchmove', function(e){
      if (e.touches.length > 1) e.preventDefault(); // pinch (2+ fingers)
    }, { passive: false });
    document.addEventListener('gesturestart', function(e){ e.preventDefault(); }); // Safari's own pinch-gesture events
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function(e){
      var now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault(); // double-tap
      lastTouchEnd = now;
    }, { passive: false });
  })();

  // iOS Safari (and others) restore the old scroll offset on reload even
  // though the envelope covers the page; force it back to the top so the
  // page never opens mid-scroll.
  if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
  window.scrollTo(0, 0);
  window.addEventListener('pageshow', function(){ window.scrollTo(0, 0); }); // iOS bfcache restore

  /* Aligns the intro watercolour's villa to the main page sketch's villa
     (size + vertical position) so the crossfade between them doesn't
     jump. Order:
       1. .villa-hero is sized to HERO_WIDTH_RATIO of .page — simple,
          fixed, no matching involved.
       2. That fixes the sketch villa's on-screen width (heroWidth *
          WIDTH_S). The watercolour is scaled so ITS villa (WIDTH_W of
          its own canvas) comes out the same on-screen width — a safety
          floor still guarantees full viewport coverage regardless.
       3. The watercolour is positioned to cover the viewport (any extra
          slack split evenly top/bottom) — this fully determines where
          its roof-edge match-point lands; it's not chasing anything.
       4. The SKETCH is the one that moves to meet it: .top's
          padding-top is corrected live (reset, measure the sketch's
          natural unadjusted roof-edge Y, then set padding-top to close
          the gap) so its roof-edge match-point lands exactly on the
          watercolour's, on *any* device. This replaces an earlier static
          guessed padding-top, which was wrong on every real device
          because it can't account for Mobile Safari's actual viewport
          height (address bar + Dynamic Island eat into it, and it
          changes as the bar hides on scroll) — measuring and correcting
          live sidesteps needing to know that number at all.
     X needs no computation at all: both source images are pre-cropped
     so the villa sits horizontally centered in each, so simply centering
     both on the viewport keeps them aligned.
     All fractions below are exact measurements taken directly on the
     source files — re-measure if either image is ever replaced or
     re-cropped:
       sketch (1292x866): villa edge-to-edge width 1212px, roof-edge Y
         match-point 367px from the top
       watercolour (1166x1254): villa edge-to-edge width 544px, roof-edge
         Y match-point 656px from the top */
  (function(){
    var WIDTH_S = 1212/1292, CY_S = 367/866;  // vila-sketch.jpg
    var WIDTH_W = 544/1166, CY_W = 656/1254;  // vila-watercolour.jpg
    var IMG_W = 1166, IMG_H = 1254;           // vila-watercolour.jpg's own canvas size
    var HERO_WIDTH_RATIO = 0.90; // .villa-hero as a fraction of .page's width — tune freely

    var hero = document.querySelector('.villa-hero');
    var photo = document.querySelector('.reveal-photo');
    var topSection = document.querySelector('.top');
    if (!hero || !photo || !topSection) return;

    function alignVilla(){
      topSection.style.marginTop = '0px'; // reset before measuring anything below

      // 1. hero width, fixed and simple
      var pageWidth = hero.parentElement.getBoundingClientRect().width;
      var heroWidth = pageWidth * HERO_WIDTH_RATIO;
      hero.style.width = heroWidth.toFixed(2) + 'px';

      // 2. watercolour scale, matched to the now-fixed sketch villa width
      var vw = window.innerWidth, vh = window.innerHeight;
      var sketchVillaWidth = heroWidth * WIDTH_S;
      var scaledW = sketchVillaWidth / WIDTH_W;
      var baseCover = Math.max(vw / IMG_W, vh / IMG_H);
      scaledW = Math.max(scaledW, IMG_W * baseCover); // safety floor: never leave gaps if width-match alone wouldn't cover the viewport
      var scale = scaledW / IMG_W;
      var scaledH = IMG_H * scale;

      // 3. watercolour position — just covers the viewport, no target to chase
      var offsetX = (vw - scaledW) / 2; // always dead-center — both source images are pre-cropped for this
      var offsetY = Math.min(0, Math.max(vh - scaledH, (vh - scaledH) / 2)); // any slack split evenly
      var waterRoofY = offsetY + CY_W * scaledH; // wherever that naturally lands is the target below

      photo.style.backgroundSize = scaledW.toFixed(2) + 'px ' + scaledH.toFixed(2) + 'px';
      photo.style.backgroundPosition = offsetX.toFixed(2) + 'px ' + offsetY.toFixed(2) + 'px';

      // 4. sketch corrects itself to meet the watercolour, using live-measured values only
      var heroRect = hero.getBoundingClientRect();
      var naturalRoofY = heroRect.top + heroRect.height * CY_S;
      // Clamped to >=0: on short/wide viewports the raw correction can go negative, which
      // pulls .top (the page's first element) up above the document's own top edge via
      // negative margin — the page's "top" then depends on this live measurement instead of
      // being a fixed point, and the sliver poking above y=0 reads as scrollable-past-top /
      // ill-defined space. The villa's natural (uncorrected) position is the hard ceiling: it
      // can be pushed lower to meet the watercolour, never pulled higher than where it already
      // renders. This sacrifices exact roof-edge alignment on those viewports for a well-defined
      // top; the intro/page crossfade just isn't pixel-perfect there.
      var correction = Math.max(0, waterRoofY - naturalRoofY);
      topSection.style.marginTop = correction.toFixed(2) + 'px';
    }

    alignVilla(); // best-effort immediately, using fallback-font metrics
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(alignVilla); // re-run once web fonts (which shift .villa-hero's height above it) are in
    }
    // Bug fix: alignVilla() measures hero.getBoundingClientRect(), which is viewport- (not
    // document-) relative — correct only while scrolled to the very top, which is the only time
    // this alignment is actually visible/relevant (it's solely for the intro-to-page crossfade).
    // Mobile Safari fires 'resize' when its address bar hides/shows *during an ordinary scroll
    // gesture*, with no width change at all — if that resize re-ran alignVilla() after the user
    // had scrolled down, the now-far-off-screen hero's negative rect.top blew "correction" up
    // into a huge bogus value applied as margin-top, inflating the layout above the user's
    // current scroll position and yanking it around (reported as "scrolling resets"). Guard
    // against both causes: skip entirely once scrolled away from the top, and for 'resize'
    // specifically, skip unless the width actually changed (address-bar toggling only ever
    // changes height).
    var lastWidth = window.innerWidth;
    function realignOnResize(){
      if (window.scrollY > 50) return; // not visible/relevant once scrolled past the intro area
      if (window.innerWidth === lastWidth) return; // height-only change (e.g. address bar), not a real resize
      lastWidth = window.innerWidth;
      alignVilla();
    }
    function realignOnRotate(){
      lastWidth = window.innerWidth;
      if (window.scrollY > 50) return; // same guard as above — irrelevant once scrolled down
      alignVilla();
    }
    window.addEventListener('resize', realignOnResize);
    window.addEventListener('orientationchange', realignOnRotate);
  })();

  (function(){
    var target = new Date('2027-09-18T15:00:00+02:00').getTime(); // 3pm, CEST (+02:00) same as today's offset
    var elD = document.getElementById('cd-days');
    var elH = document.getElementById('cd-hours');
    var elM = document.getElementById('cd-min');
    var elS = document.getElementById('cd-sec');
    function pad(n){ return String(n).padStart(2,'0'); }
    function tick(){
      var now = Date.now();
      var diff = Math.max(0, target - now);
      var s = Math.floor(diff/1000);
      var days = Math.floor(s/86400);
      var hours = Math.floor((s%86400)/3600);
      var mins = Math.floor((s%3600)/60);
      var secs = s%60;
      elD.textContent = days;
      elH.textContent = pad(hours);
      elM.textContent = pad(mins);
      elS.textContent = pad(secs);
    }
    tick();
    setInterval(tick, 1000);
  })();

  (function(){
    var cover = document.getElementById('envelopeCover');
    var btn = document.getElementById('envelopeBtn');
    var frame = document.querySelector('.bracket-frame');
    // note(1.1s) / names(1.7s) / envelope+seal pop(2.1s) / hint(2.8s) — last of the entrance
    // animations to finish is the hint; only then does the envelope become clickable.
    setTimeout(function(){ cover.classList.add('ready'); }, 2800);
    // .landscape-band's own fadeIn delay+duration (13.0s+1.3s, see its CSS comment) is counted
    // from page load, not from the envelope click — so "once the landscape has fully appeared"
    // is this fixed point in load-relative time.
    var LANDSCAPE_DONE_AT = performance.timeOrigin + 14300;
    function openEnvelope(){
      if (cover.classList.contains('opened')) return;
      if (!cover.classList.contains('ready')) return; // guards a stray click landing before pointer-events:auto kicks in
      window.scrollTo(0, 0); // always start the page at the top
      cover.classList.add('opened');
      setTimeout(function(){
        window.scrollTo(0, 0);
        cover.style.display = 'none';
      }, 7500); // matches cover fade: 4.1s delay + 3.4s fade
      // scroll stays locked until the landscape band has fully faded in (never earlier than
      // the cover itself has finished fading away) — until then the band shows half cut off
      // at the bottom of the screen, which is what tells a guest there's more to scroll to
      var unlockDelay = Math.max(7500, LANDSCAPE_DONE_AT - Date.now());
      setTimeout(function(){
        document.body.classList.remove('locked');
        // the bracket (countdown/locations/contact/footer) stays invisible until scrolled
        // into view. IntersectionObserver instead of a raw 'scroll' listener + classList
        // mutation: that combo forced a style recalc right as the scroll gesture began,
        // which is what caused the felt lag/jank at the start of scrolling.
        if (!('IntersectionObserver' in window)){ frame.classList.add('in-view'); return; }
        var io = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if (entry.isIntersecting){
              frame.classList.add('in-view');
              io.unobserve(frame);
            }
          });
        }, { threshold: 0.05 });
        io.observe(frame);
      }, unlockDelay);
    }
    btn.addEventListener('click', openEnvelope);
  })();
</script>
